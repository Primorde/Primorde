    <div class="texto_servicos">
        <img src="img/main/section_servicos/texto_servicos.webp" alt="Somos uma empresa especializada em construções, reformas e soluções completas, oferecendo também a possibilidade de fornecimento de materiais, garantindo mais praticidade aos nossos clientes. Na Primorde, qualidade e compromisso são primordiais. Mais do que executar serviços, entregamos confiança, segurança e resultados duradouros.

Atuamos em diversas áreas, como alvenaria, cobertura, elétrica, hidráulica e acabamento, sempre com foco em oferecer soluções completas para nossos clientes. Oferecemos pacotes completos, com instalações e materiais inclusos, de uma ampla linha de equipamentos e acessórios.
">

                allowfullscreen=""

        </div>


        <div class="bloco2">

            <div class="texto_atendimento">
                <img src="img/main/section_atendimento/texto_atendimento.webp" alt="Atendemos em Teixeira de Freitas e toda a região, oferecendo serviços completos para sua residência ou estabelecimento, garantindo soluções eficientes, seguras e adequadas as suas. necessidades. Realizamos visita técnica especializada sempre que necessário, proporcionando uma avaliação detalhada no local e a elaboração de um orçamento mais preciso, transparente e personalizado, assegurando total clareza em cada etapa do processo.

Nosso horário de funcionamento é de segunda a sábado, em horário comercial, com atendimento comprometido com qualidade, pontualidade e a satisfação de nossos clientes.
">
            </div>

            <div class="menu_atendimento">
